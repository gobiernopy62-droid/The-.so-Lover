name: Build libwebp for Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: webmproject/libwebp
          ref: v1.4.0

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Configure
        run: |
          mkdir build && cd build
          cmake .. \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DBUILD_SHARED_LIBS=ON \
            -DWEBP_BUILD_CWEBP=OFF -DWEBP_BUILD_DWEBP=OFF \
            -DWEBP_BUILD_GIF2WEBP=OFF -DWEBP_BUILD_IMG2WEBP=OFF \
            -DWEBP_BUILD_VWEBP=OFF -DWEBP_BUILD_WEBPINFO=OFF \
            -DWEBP_BUILD_EXTRAS=OFF

      - name: Build
        run: cmake --build build -j4

      - name: Collect .so files
        run: |
          mkdir -p out/${{ matrix.abi }}
          find build -name "*.so" -exec cp {} out/${{ matrix.abi }}/ \;

      - uses: actions/upload-artifact@v4
        with:
          name: libwebp-${{ matrix.abi }}
          path: out/${{ matrix.abi }}